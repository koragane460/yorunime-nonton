<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bfe9ff"/>
      <stop offset=".45" stop-color="#7cc8f5"/>
      <stop offset="1" stop-color="#2b6f9e"/>
    </linearGradient>
    <radialGradient id="puff" cx="40%" cy="32%" r="68%">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#f3fbff"/>
      <stop offset="1" stop-color="#cfe8f7"/>
    </radialGradient>
    <radialGradient id="puff2" cx="45%" cy="30%" r="70%">
      <stop stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#b7dcf2"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="12" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>

  <g opacity=".95">
    <!-- Awan besar atas -->
    <g transform="translate(26 8)">
      <ellipse cx="92" cy="78" rx="58" ry="42" fill="url(#puff)"/>
      <ellipse cx="150" cy="70" rx="48" ry="40" fill="url(#puff2)"/>
      <ellipse cx="198" cy="86" rx="40" ry="30" fill="url(#puff)"/>
      <ellipse cx="120" cy="102" rx="92" ry="26" fill="#ffffff" opacity=".9"/>
      <ellipse cx="118" cy="72" rx="36" ry="30" fill="#ffffff" opacity=".85"/>
    </g>
    <!-- Awan kanan atas -->
    <g transform="translate(236 96) scale(.8)">
      <ellipse cx="60" cy="56" rx="52" ry="36" fill="url(#puff2)"/>
      <ellipse cx="112" cy="50" rx="42" ry="32" fill="url(#puff)"/>
      <ellipse cx="76" cy="76" rx="78" ry="20" fill="#fff" opacity=".92"/>
    </g>
    <!-- Awan kiri tengah -->
    <g transform="translate(2 190) scale(.9)">
      <ellipse cx="58" cy="52" rx="54" ry="34" fill="url(#puff)"/>
      <ellipse cx="110" cy="46" rx="38" ry="28" fill="url(#puff2)"/>
      <ellipse cx="70" cy="70" rx="74" ry="18" fill="#fff" opacity=".9"/>
    </g>
    <!-- Awan bawah -->
    <g transform="translate(96 288) scale(1.05)">
      <ellipse cx="54" cy="48" rx="50" ry="34" fill="url(#puff2)"/>
      <ellipse cx="104" cy="42" rx="40" ry="28" fill="url(#puff)"/>
      <ellipse cx="64" cy="66" rx="72" ry="18" fill="#fff" opacity=".88"/>
    </g>
    <!-- Awan kanan bawah -->
    <g transform="translate(286 254) scale(.65)">
      <ellipse cx="58" cy="48" rx="54" ry="34" fill="url(#puff)"/>
      <ellipse cx="106" cy="44" rx="36" ry="26" fill="url(#puff2)"/>
    </g>
  </g>

  <!-- Salju & kilau -->
  <g fill="#ffffff">
    <circle cx="58" cy="150" r="2.2" opacity=".9"/>
    <circle cx="320" cy="180" r="1.8" opacity=".8"/>
    <circle cx="352" cy="66" r="2.4" opacity=".85"/>
    <circle cx="210" cy="140" r="1.4" opacity=".7"/>
    <circle cx="120" cy="250" r="2" opacity=".8"/>
    <circle cx="366" cy="300" r="1.6" opacity=".75"/>
    <circle cx="30" cy="330" r="2.2" opacity=".8"/>
    <circle cx="256" cy="352" r="1.5" opacity=".7"/>
  </g>
  <rect width="400" height="400" filter="url(#grain)" opacity=".35"/>
</svg>
