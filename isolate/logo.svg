<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="YoruNime">
  <!--
    Logo YoruNime.
    Memakai file gambar asli (logo-source.jpg) lalu dipotong mengikuti
    persegi membulat, supaya sudut putih di sekeliling gambar hilang total.
  -->
  <defs>
    <clipPath id="ynSquircle">
      <rect width="640" height="640" rx="140" />
    </clipPath>
  </defs>
  <g clip-path="url(#ynSquircle)">
    <image width="640" height="640"
           preserveAspectRatio="xMidYMid slice"
           href="logo-source.jpg"
           xlink:href="logo-source.jpg" />
  </g>
</svg>