<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200" fill="none">
  <defs>
    <linearGradient id="steel" x1="20" y1="60" x2="220" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset=".28" stop-color="#94a3b8"/>
      <stop offset=".55" stop-color="#334155"/>
      <stop offset=".8" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="grip" x1="100" y1="110" x2="150" y2="196" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3f3f46"/>
      <stop offset=".5" stop-color="#18181b"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="edge" x1="30" y1="55" x2="200" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
    </filter>
  </defs>

