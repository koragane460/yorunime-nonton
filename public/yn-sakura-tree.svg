<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640">
  <defs>
    <linearGradient id="bark" x1="480" y1="40" x2="240" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b3a3f"/>
      <stop offset=".45" stop-color="#3d252b"/>
      <stop offset="1" stop-color="#1c1115"/>
    </linearGradient>
    <radialGradient id="blossom" cx="38%" cy="30%" r="72%">
      <stop stop-color="#fff0f6"/>
      <stop offset=".45" stop-color="#ffc2dc"/>
      <stop offset=".8" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#be185d"/>
    </radialGradient>
    <radialGradient id="blossomDeep" cx="40%" cy="32%" r="75%">
      <stop stop-color="#ffe4ef"/>
      <stop offset=".5" stop-color="#fb9ec4"/>
      <stop offset="1" stop-color="#9d174d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- Batang & cabang, tekstur kayu -->
  <g fill="none" stroke="url(#bark)" stroke-linecap="round">
    <path d="M596 34C520 95 478 160 456 232c-18 60-12 128 18 206" stroke-width="26"/>
    <path d="M548 96c-76 34-132 84-170 148-26 44-40 100-40 160" stroke-width="15"/>
    <path d="M506 154c-96 20-168 58-220 112" stroke-width="11"/>
    <path d="M468 214c-82 6-146 30-196 70" stroke-width="8"/>
    <path d="M438 278c-56-8-104-2-148 18" stroke-width="6"/>
    <path d="M590 60c-48 6-94 24-132 52" stroke-width="7"/>
    <path d="M390 316c-34 34-56 76-66 126" stroke-width="5"/>
    <path d="M470 214c-6 48-2 90 12 128" stroke-width="4"/>
  </g>
  <g stroke="#8a5a5f" stroke-width="1.5" opacity=".35" fill="none">
    <path d="M588 44c-70 62-108 130-128 206"/>
    <path d="M548 100c-70 36-124 84-160 146"/>
    <path d="M504 158c-84 22-152 60-202 112"/>
  </g>

  <!-- Rumpun bunga sakura -->
  <g>
    <!-- helper blossoms -->
    <g transform="translate(544 46) scale(1.25)">
      <circle r="34" fill="url(#blossom)"/><circle cx="24" cy="-14" r="22" fill="url(#blossomDeep)" opacity=".9"/><circle cx="-26" cy="10" r="20" fill="url(#blossom)" opacity=".85"/>
    </g>
    <g transform="translate(470 92) scale(1.1)">
      <circle r="30" fill="url(#blossomDeep)"/><circle cx="-22" cy="-16" r="18" fill="url(#blossom)"/><circle cx="20" cy="18" r="16" fill="url(#blossom)" opacity=".9"/>
    </g>
    <g transform="translate(420 160) scale(1.05)">
      <circle r="26" fill="url(#blossom)"/><circle cx="18" cy="16" r="16" fill="url(#blossomDeep)"/><circle cx="-18" cy="8" r="14" fill="url(#blossom)"/>
    </g>
    <g transform="translate(356 206) scale(.95)">
      <circle r="24" fill="url(#blossomDeep)"/><circle cx="16" cy="-14" r="15" fill="url(#blossom)"/>
    </g>
    <g transform="translate(300 250) scale(.9)">
      <circle r="22" fill="url(#blossom)"/><circle cx="-14" cy="12" r="13" fill="url(#blossomDeep)"/>
    </g>
    <g transform="translate(260 300) scale(.8)">
      <circle r="19" fill="url(#blossomDeep)"/><circle cx="12" cy="10" r="12" fill="url(#blossom)"/>
    </g>
    <g transform="translate(370 300) scale(.85)">
      <circle r="20" fill="url(#blossom)"/><circle cx="-12" cy="10" r="12" fill="url(#blossomDeep)"/>
    </g>
    <g transform="translate(486 252) scale(.9)">
      <circle r="22" fill="url(#blossom)"/><circle cx="14" cy="-10" r="12" fill="url(#blossomDeep)"/>
    </g>
    <g transform="translate(540 180) scale(.75)">
      <circle r="18" fill="url(#blossomDeep)"/>
    </g>
    <g transform="translate(450 70) scale(.7)">
      <circle r="16" fill="url(#blossom)"/>
    </g>
    <g transform="translate(320 340) scale(.7)">
      <circle r="15" fill="url(#blossom)"/><circle cx="10" cy="-8" r="10" fill="url(#blossomDeep)"/>
    </g>
    <g transform="translate(590 140) scale(.65)">
      <circle r="15" fill="url(#blossomDeep)"/>
    </g>
  </g>

  <!-- Bunga kecil (5 kelopak) di rumpun -->
  <g fill="#fff0f7" opacity=".8">
    <g transform="translate(548 62)"><circle cx="-5" cy="-5" r="6"/><circle cx="5" cy="-5" r="6"/><circle cx="0" cy="4" r="6"/></g>
    <g transform="translate(452 118)"><circle cx="-5" cy="-5" r="5"/><circle cx="5" cy="-5" r="5"/><circle cx="0" cy="4" r="5"/></g>
    <g transform="translate(398 194)"><circle cx="-4" cy="-4" r="4.5"/><circle cx="4" cy="-4" r="4.5"/><circle cx="0" cy="4" r="4.5"/></g>
    <g transform="translate(300 270)"><circle cx="-4" cy="-4" r="4"/><circle cx="4" cy="-4" r="4"/><circle cx="0" cy="4" r="4"/></g>
  </g>

  <!-- Kelopak lepas -->
  <g fill="#fbcfe8" opacity=".85" filter="url(#soft)">
    <path d="M480 330c8 0 14 6 14 14 0 9-8 16-14 22-6-6-14-13-14-22 0-8 6-14 14-14Z"/>
    <path d="M560 250c6 0 11 5 11 11 0 7-6 12-11 17-5-5-11-10-11-17 0-6 5-11 11-11Z" opacity=".8"/>
    <path d="M390 400c6 0 10 4 10 10 0 7-5 12-10 16-5-4-10-9-10-16 0-6 4-10 10-10Z" opacity=".75"/>
    <path d="M500 430c5 0 9 4 9 9 0 6-5 11-9 14-4-3-9-8-9-14 0-5 4-9 9-9Z" opacity=".7"/>
  </g>

  <rect width="620" height="640" filter="url(#grain)" opacity=".4"/>
</svg>
